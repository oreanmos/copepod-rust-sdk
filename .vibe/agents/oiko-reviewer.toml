# Oiko kit: Vibe definition of the oiko-reviewer role (see .claude/skills/oiko-build/SKILL.md, Roles and models).
# Run headless for its own model: vibe --trust --agent oiko-reviewer -p "<brief>" --auto-approve --output json --output-dir <dir>
description = "Oiko reviewer: read-only branch review of one slice"
agent_type = "agent"
safety = "yolo"
