# Codex settings for the Oiko repos (oikonotes, copepod, copepod-rust-sdk).
# Codex applies them only after you trust the repository. The main session
# plans and orchestrates; subagents (.codex/agents/) implement, review and scout.
model = "gpt-6-sol"
model_reasoning_effort = "max"

# Cross-repo builds create worktrees in the sibling repos. Their absolute paths
# are machine-specific, so setup-machine.sh writes them (writable_roots, project
# trust) into ~/.codex/config.toml.
[sandbox_workspace_write]
# Copepod tests bind fake services on 127.0.0.1 (fake Mollie, NUT); without
# network access every such run needed an owner-approved escalation.
network_access = true

# sccache cannot start inside the sandbox; an empty RUSTC_WRAPPER makes cargo
# compile directly instead of failing.
[shell_environment_policy]
set = { RUSTC_WRAPPER = "" }

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
